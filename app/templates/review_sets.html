{% extends 'base.html' %}

{% block title %}One Qty Review{% endblock %}
{% block page_title %}One Qty Review{% endblock %}

{% block content %}
<div class="card dashboard-card">
  <div class="card-body">
    <div class="d-flex flex-wrap gap-3 align-items-end justify-content-between mb-3">
      <div class="filter-grid">
        <div>
          <label class="form-label">Main Code</label>
          <input id="mainCodeFilter" type="text" class="form-control" placeholder="Filter" />
        </div>
        <div>
          <label class="form-label">Child Code</label>
          <input id="childCodeFilter" type="text" class="form-control" placeholder="Filter" />
        </div>
        <div>
          <label class="form-label">Description</label>
          <input id="descriptionFilter" type="text" class="form-control" placeholder="Filter" />
        </div>
      </div>

      <div class="d-flex gap-2 align-items-end">
        <button id="applyFiltersBtn" class="btn btn-primary">Apply</button>
        <button id="clearFiltersBtn" class="btn btn-outline-secondary">Clear</button>
        <button id="reviewExportBtn" class="btn btn-warning">Export Review Excel</button>
      </div>
    </div>

    <div class="table-responsive custom-table-wrap">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Main Code</th>
            <th>Description</th>
            <th>Set Size</th>
            <th>Missing Qty</th>
            <th>Short Component</th>
            <th>Component Quantities</th>
          </tr>
        </thead>
        <tbody id="reviewTableBody"></tbody>
      </table>
    </div>

    <div class="pagination-toolbar mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div id="reviewResultsInfo" class="text-muted">Showing 0 records</div>
      <nav>
        <ul id="reviewPaginationControls" class="pagination pagination-sm mb-0"></ul>
      </nav>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/app.js') }}?v=20260911-review-page"></script>
{% endblock %}
